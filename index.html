<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Claude Code-style study app for the Claude Certified Architect exams, Foundations (CCAR-F) and Professional (CCAR-P): paced plans, resource library, labs, projects and practice questions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141413'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23d97757' font-family='monospace'%3E%E2%9C%BB%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CCAR Study Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one terminal column, transcript-style output blocks, sticky prompt box + status line at the bottom (Claude Code look) */
:root {
  /* Claude Code dark theme */
  --bg: #141413;
  --panel: #1e1e1d;
  --raise: #2a2a28;
  --fg: #ececec;
  --muted: #999999;
  --dim: #6b6b69;
  --line: #3a3a38;
  --accent: #d77757;
  --accent-ink: #141413;
  --accent-soft: rgba(215,119,87,.15);
  --ok: #4eba65;
  --warn: #ffc107;
  --err: #ff6b80;
  --info: #b1b9f9;
  --vio: #c2a3e8;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
/* Claude Code light theme */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --panel: #f6f6f4; --raise: #efefec; --fg: #1d1d1b; --muted: #666666; --dim: #8f8f8b;
    --line: #dcdcd7; --accent: #d77757; --accent-ink: #ffffff; --accent-soft: rgba(215,119,87,.12);
    --ok: #2c7a39; --warn: #966c1e; --err: #ab2b3f; --info: #5769f7; --vio: #7b4fb8; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --panel: #f6f6f4; --raise: #efefec; --fg: #1d1d1b; --muted: #666666; --dim: #8f8f8b;
  --line: #dcdcd7; --accent: #d77757; --accent-ink: #ffffff; --accent-soft: rgba(215,119,87,.12);
  --ok: #2c7a39; --warn: #966c1e; --err: #ab2b3f; --info: #5769f7; --vio: #7b4fb8; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--mono); font-size: 13.5px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 0;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--info) 40%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--info); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: calc(100vh - 18px); }

/* welcome box */
.welcome { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: start; }
.welcome .star { color: var(--accent); font-size: 22px; line-height: 1.2; grid-row: span 3; }
.welcome .hello { font-weight: 700; }
.welcome .hello b { color: var(--accent); }
.welcome .sub { color: var(--muted); }
.welcome .sub code { color: var(--fg); }

/* command tabs */
.cmds { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.cmd { padding: 2px 8px; border-radius: 4px; color: var(--muted); border: 1px solid transparent; }
.cmd:hover { color: var(--fg); border-color: var(--line); }
.cmd[aria-current="page"] { color: var(--accent-ink); background: var(--accent); font-weight: 500; }

/* transcript */
.out { display: flex; flex-direction: column; gap: 14px; flex: 1; padding-bottom: 8px; }
.echo { background: var(--raise); color: var(--muted); padding: 2px 10px; border-radius: 4px; align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; }
.echo::before { content: "> "; color: var(--dim); }
.blk { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bullet { display: grid; grid-template-columns: 1.4em 1fr; min-width: 0; }
.bullet > .dot { color: var(--fg); }
.bullet > .dot.a { color: var(--accent); }
.bullet > .dot.g { color: var(--ok); }
.bullet > .dot.w { color: var(--warn); }
.bullet > .dot.e { color: var(--err); }
.bullet > div { min-width: 0; }
.h { font-weight: 700; }
.h .tool { color: var(--fg); }
.h .arg { color: var(--muted); font-weight: 400; }
.res { display: grid; grid-template-columns: 2.8em 1fr; color: var(--muted); min-width: 0; }
.res::before { content: "  \23BF"; color: var(--dim); white-space: pre; }
.res > div { min-width: 0; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.acc { color: var(--accent); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.err { color: var(--err); }
.mt { margin-top: 6px; }
.nowrap { white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
p { margin: 0; max-width: 78ch; }
.note { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); max-width: 80ch; }
.note.warnb { border-left-color: var(--warn); }
.note.accb { border-left-color: var(--accent); }

/* todo list */
.todos { display: flex; flex-direction: column; }
.todo { display: grid; grid-template-columns: 2.8em 1.6em 1fr auto; align-items: start; gap: 0 6px; padding: 3px 0; min-width: 0; }
.todo .gut { color: var(--dim); white-space: pre; }
.todo .box { color: var(--muted); text-align: left; }
.todo .box:hover { color: var(--accent); }
.todo.done .box { color: var(--ok); }
.todo.done.justdone { animation: donepulse 1.4s ease-out; border-radius: 4px; }
@keyframes donepulse { 0% { background: color-mix(in srgb, var(--ok) 28%, transparent); } 100% { background: transparent; } }
.donechip { font-size: 11.5px; margin-left: 4px; white-space: nowrap; }
.todo .box { width: 16px; height: 16px; margin-top: 3px; border: 1.5px solid var(--muted); border-radius: 3px; font-size: 0; line-height: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; }
.todo .box::before { content: ""; position: absolute; inset: -6px; }
.todo .box:hover { border-color: var(--accent); }
.todo .box[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.todo .box[aria-pressed="true"]::after { content: ""; width: 4px; height: 8px; border: solid var(--bg); border-width: 0 2px 2px 0; transform: translate(0, -1px) rotate(45deg); }
.todo .ti { min-width: 0; overflow-wrap: anywhere; }
.todo.done .ti .tt { color: var(--dim); text-decoration: line-through; }
.todo.next .ti .tt { color: var(--fg); font-weight: 700; }
.todo .meta { color: var(--dim); white-space: nowrap; font-size: 12px; display: inline-flex; align-items: baseline; gap: 8px; justify-content: flex-end; }
.todo .meta .m-cal { width: 3.4em; text-align: left; }
.todo .meta .m-wk { width: 3.2em; text-align: right; }
.todo .meta .m-dur { width: 3.4em; text-align: right; }
.todo .tt { cursor: pointer; }
.todo .detail { grid-column: 3 / 5; margin-top: 4px; padding: 8px 10px; background: var(--panel); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.todo .detail .lbl { color: var(--fg); }
.tag { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 11.5px; border: 1px solid var(--line); color: var(--muted); margin-right: 3px; white-space: nowrap; }
.tag.d { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.tag.k { min-width: 6.2em; text-align: center; }
.fpanel { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 8px 12px; align-items: center; max-width: 760px; }
.flbl { color: var(--dim); }
.fsearch { width: 100%; max-width: 420px; }
.chip .cnt { color: var(--dim); font-size: 11px; }
.chip[aria-pressed="true"] .cnt { color: inherit; opacity: .75; }
.linkbtn { color: var(--info); text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 560px) { .fpanel { grid-template-columns: 1fr; gap: 4px; } .fpanel .flbl { margin-top: 4px; } }
.trapbtn { display: inline-flex; gap: 2px; align-items: baseline; padding: 1px 0; }
.trapbtn:hover .warn { text-decoration: underline; }
.trapbtn .caret { color: var(--warn); width: 1em; }
.traps { margin-top: 4px; padding-left: 1.2em; }
.cal { font-size: 11.5px; color: var(--info); text-decoration: none; border: 1px solid color-mix(in srgb, var(--info) 40%, transparent); border-radius: 3px; padding: 0 4px; }
.cal:hover { background: color-mix(in srgb, var(--info) 14%, transparent); }
.kind-build { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.kind-lab { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.kind-video { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.kind-quiz { color: var(--vio); border-color: color-mix(in srgb, var(--vio) 45%, transparent); }
.kind-practice { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }

/* week header */
.week { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-top: 6px; }
.week .wk { color: var(--accent); font-weight: 700; }
.week.cur .wk::after { content: " \25C2 you are here"; color: var(--warn); font-weight: 400; }

/* bars */
.bar { font-variant-numeric: tabular-nums; white-space: pre; }
.bar .f { color: var(--accent); }
.bar .e { color: var(--line); }
.rowgrid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: baseline; }
.dgrid { display: grid; grid-template-columns: 3.2em minmax(0,1fr) auto auto; gap: 2px 14px; align-items: baseline; }
.dgrid .bar { justify-self: start; }

/* table */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; min-width: 100%; }
td, th { text-align: left; padding: 3px 14px 3px 0; vertical-align: top; }
th { color: var(--dim); font-weight: 400; }
td:first-child { color: var(--muted); white-space: nowrap; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12.5px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
input[type="search"], input[type="date"], input[type="time"], input[type="password"], input[type="text"]:not(#promptIn), select, textarea {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px;
}
textarea { width: 100%; min-height: 64px; resize: vertical; }

/* quiz */
.q { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 2.4em 1fr; text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k { color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); }
.opt.right .k { color: var(--ok); }
.opt.wrong { border-color: var(--err); }
.opt.wrong .k { color: var(--err); }
.opt[disabled] { cursor: default; }
.btn { padding: 3px 10px; border: 1px solid var(--line); border-radius: 5px; color: var(--fg); }
.btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover:not([disabled]) { color: var(--accent-ink); filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* chat */
.chat-a { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.spin { color: var(--accent); }

/* prompt dock */
.dock { position: sticky; bottom: 0; background: var(--bg); padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.suggest { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 4px 0; max-height: 220px; overflow-y: auto; }
.suggest button { display: grid; grid-template-columns: 11em 1fr; gap: 10px; width: 100%; text-align: left; padding: 2px 12px; color: var(--muted); }
.suggest button .c { color: var(--fg); }
.suggest button.on, .suggest button:hover { background: var(--accent-soft); }
.suggest button.on .c { color: var(--accent); }
.prompt { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.prompt:focus-within { border-color: var(--muted); }
.prompt .gt { color: var(--muted); }
.prompt input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; outline: none; }
.prompt input::placeholder { color: var(--dim); }
.status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; color: var(--dim); font-size: 12px; padding: 0 4px; }
.status .r { display: flex; flex-wrap: wrap; gap: 0 12px; }
.sync-ok { color: var(--ok); }
.themebtn { color: var(--dim); font-size: 12px; }
.ver { color: var(--muted); text-decoration: none; }
.ver:hover { color: var(--accent); text-decoration: underline; }
.themebtn:hover { color: var(--accent); }
@media (max-width: 560px) {
  body { font-size: 12.5px; }
  .todo { grid-template-columns: 1.6em 1fr auto; }
  .todo .gut { display: none; }
  .todo .detail { grid-column: 2 / 4; }
  .res { grid-template-columns: 1.8em 1fr; }
  .res::before { content: "\23BF"; }
  .dgrid { grid-template-columns: 2.6em minmax(0,1fr) auto; }
  .dgrid .hide-s { display: none; }
  .suggest button { grid-template-columns: 8.5em 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="welcome" aria-label="Welcome">
    <div class="star" aria-hidden="true">&#10043;</div>
    <div class="hello">Welcome to <b>CCAR Study Code</b> <span class="dim">·</span> <span class="acc" id="trName">CCAR-F</span></div>
    <div class="sub"><span id="trSub">Claude Certified Architect, Foundations prep</span>. Type <code>/help</code> for commands, or ask a question.</div>
    <div class="sub">cwd: <code>~/certs/claude-certified-architect</code> <span class="dim">·</span> <a href="#changelog" class="ver" id="verLink">v1.5.0</a></div>
  </header>

  <nav class="cmds" id="cmds" aria-label="Views">
    <a class="cmd" href="#today" data-view="today">/today</a>
    <a class="cmd" href="#plan" data-view="plan">/plan</a>
    <a class="cmd" href="#domains" data-view="domains">/domains</a>
    <a class="cmd" href="#resources" data-view="resources">/resources</a>
    <a class="cmd" href="#labs" data-view="labs">/labs</a>
    <a class="cmd" href="#projects" data-view="projects">/projects</a>
    <a class="cmd" href="#quiz" data-view="quiz">/quiz</a>

    <a class="cmd" href="#config" data-view="config">/config</a>

  <main class="out" id="out" aria-live="polite"></main>

  <div class="dock">
    <div class="suggest" id="suggest" hidden></div>
    <form class="prompt" id="promptForm" autocomplete="off">
      <span class="gt" aria-hidden="true">&gt;</span>
      <label for="promptIn" class="dim" style="position:absolute;left:-9999px">Command or question</label>
      <input id="promptIn" type="text" placeholder='Try "/quiz d1" or ask "when should I use a subagent?"' enterkeyhint="send">
    </form>
    <div class="status">
      <span id="stLeft">? /help for commands</span>
      <span class="r"><button type="button" id="themeBtn" class="themebtn" title="Switch theme" aria-label="Switch theme"></button><span class="r" id="stRight"></span></span>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------- data ---------------- */
const F_DOMAINS = [
  { id: "D1", name: "Agentic Architecture & Orchestration", w: 27,
    tasks: ["1.1 Agentic loops", "1.2 Multi-agent orchestration", "1.3 Subagent invocation and context passing", "1.4 Workflow enforcement and handoff", "1.5 Agent SDK hooks", "1.6 Task decomposition strategies", "1.7 Session state and resumption"],
    traps: ["Rules that must always hold (limits, call order) belong in code: hooks, gates, tool-layer checks. A stronger prompt is guidance, not a guarantee.", "Loop while stop_reason is tool_use; stop on end_turn. Never parse the text for \"done\" or rely on an iteration cap as the main exit.", "Subagents start with a fresh context. Pass constraints, prior findings and the output format explicitly.", "Parallel work = the coordinator emits several subagent calls in one response.", "Multi-agent costs many times the tokens of a single agent. Use it for breadth that parallelizes, not for tightly coupled work."] },
  { id: "D2", name: "Tool Design & MCP Integration", w: 18,
    tasks: ["2.1 Tool interface design", "2.2 Structured error responses", "2.3 Tool distribution and tool choice", "2.4 MCP server integration", "2.5 Built-in tools"],
    traps: ["Tool descriptions are the main lever for tool selection: say what it does, when to use it instead of its neighbor, inputs and what it returns.", "Return structured errors (is_error, category, retryable, a useful message), never an empty \"success\".", "Give each agent only the 4 or 5 tools its role needs. 18 tools per agent degrades selection.", "tool_choice: auto (may answer in text), any (must call some tool), tool (must call this one), none.", "MCP primitives: tools act, resources expose data for context, prompts are reusable templates. Team servers go in a committed .mcp.json with env-var expansion for secrets."] },
  { id: "D3", name: "Claude Code Configuration & Workflows", w: 20,
    tasks: ["3.1 CLAUDE.md hierarchy, scoping, modular organization", "3.2 Custom slash commands and skills", "3.3 Path-specific rules", "3.4 Plan mode vs direct execution", "3.5 Iterative refinement", "3.6 CI/CD integration"],
    traps: ["CLAUDE.md layers: user (~/.claude/CLAUDE.md, all your projects), project (committed, whole team), subdirectory. CLAUDE.local.md is personal and per project.", ".claude/rules/ files with a paths: glob load only for matching files, even when they are scattered across the repo.", "Skills: SKILL.md with a description that triggers it; context: fork runs it isolated; allowed-tools scopes it.", "Plan mode for multi-file or architectural change; direct execution for small, well-specified edits.", "CI: non-interactive -p (print) mode, --output-format json for parsing. Review with an independent instance, not the session that wrote the code."] },
  { id: "D4", name: "Prompt Engineering & Structured Output", w: 20,
    tasks: ["4.1 System prompts with explicit criteria", "4.2 Few-shot prompting", "4.3 Structured output with tool use", "4.4 Validation, retry, and feedback loops", "4.5 Batch processing strategies", "4.6 Multi-instance and multi-pass review"],
    traps: ["Explicit criteria beat adjectives. \"Flag only important issues\" is vague; define what counts and give examples.", "Use few-shot examples for the ambiguous cases, including the reasoning for the chosen handling.", "Schema guarantees come from forced tool use or structured outputs, not from \"respond in JSON\".", "Schema-valid is not correct. Validate in code, retry with the specific error fed back; if the source lacks the data, allow null instead of retrying.", "Message Batches: about half the cost, results within 24 hours, custom_id per request. Wrong for anything a person is waiting on."] },
  { id: "D5", name: "Context Management & Reliability", w: 15,
    tasks: ["5.1 Context window management", "5.2 Escalation and ambiguity resolution", "5.3 Error propagation in multi-agent systems", "5.4 Codebase exploration and context degradation", "5.5 Human review and confidence calibration", "5.6 Information provenance and multi-source synthesis"],
    traps: ["Keep a persistent case-facts block (IDs, amounts, dates) outside summarization so compaction cannot lose them.", "Escalate when the customer asks for a human, when policy does not cover the case, or when the agent cannot make progress. Sentiment alone is a weak trigger.", "Propagate structured failure context (what failed, partial results, retryable?) to the coordinator; do not swallow errors or abort everything.", "Fight context degradation with subagents for exploration and summaries, scratchpad files, and /compact at sensible points.", "Calibrate confidence on a labeled set, route low confidence to humans, keep sampling high confidence. Preserve sources and dates; annotate conflicts instead of picking one."] }
];

const F_SCENARIOS = ["Customer Support Resolution Agent", "Code Generation with Claude Code", "Multi-Agent Research System", "Developer Productivity with Claude", "Claude Code for Continuous Integration", "Structured Data Extraction"];

const RES_ALL = [
  // official
  { id: "cert", ty: "official", t: "CCAR-F certification page and exam guide", u: "https://anthropic-partners.skilljar.com/claude-certified-architect-foundations-certification", d: ["D1","D2","D3","D4","D5"], m: 45, n: "Download the exam guide (v1.0, effective July 2026). It is the syllabus: 5 domains, 30 task statements, 6 scenarios, sample questions." },
  { id: "access", ty: "official", t: "Exam access request (partner email required)", u: "https://anthropic.skilljar.com/claude-certified-architect-foundations-access-request", d: [], m: 10, n: "Registration needs an email on a Claude Partner Network organization's domain. Personal addresses are rejected." },

function mergeInto(base, other) {

  for (const [k, arr] of Object.entries(other.proj || {})) { const b = base.proj[k] || []; base.proj[k] = (arr || []).map((v, i) => !!(v || b[i])).concat(b.slice((arr || []).length)); }

  for (const [k, q] of Object.entries(other.quiz || {})) if (!base.quiz[k] || (q && q.n > base.quiz[k].n)) base.quiz[k] = q;

async function initStore() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    const owner = await user.isOwner();
    if (!uid && !owner) return;
    const privRef = uid ? db.doc("data/users/" + uid + "/state") : null;
    dbRef = owner ? db.doc("owner/state") : privRef;
    isOwnerView = owner;
    let first = true;
    const t = setTimeout(() => { if (first) renderStatus("sync: account store not reachable yet"); }, 10000);
    dbRef.onSnapshot(async snap => {
      if (snap.metadata.fromCache && first) return;
      clearTimeout(t);
      if (first) {
        first = false;
        const local = S;
        let base = snap.exists ? normalize(snap.data()) : DEFAULTS();
        if (!base.migrated) {
          if (owner && privRef) { try { const p = await privRef.get(); if (p.exists) base = mergeInto(base, normalize(p.data())); } catch (e) {} }
          base = mergeInto(base, local);
          base.migrated = true;
          S = base; saveLocal(); sync = "db"; render(); flush();
        } else { S = base; saveLocal(); sync = "db"; render(); }
        return;
      }
      if (saveTimer || saving || snap.metadata.hasPendingWrites) return;
      if (snap.exists) { S = normalize(snap.data()); saveLocal(); render(); }
    }, () => { clearTimeout(t); dbRef = null; sync = "local"; renderStatus(); });
  } catch (e) { dbRef = null; }
}

/* Weekdays Mon-Thu hold up to 60 min; Sat and Sun take the long items. Past-due items move to the next free day from today. */
function slots() {

  const wd = toMin(S.settings.wdTime), we = toMin(S.settings.weTime);
  const DAYS = [{ off: 0, cap: 60, t: wd }, { off: 1, cap: 60, t: wd }, { off: 2, cap: 60, t: wd }, { off: 3, cap: 60, t: wd }, { off: 5, cap: 150, t: we }, { off: 6, cap: 150, t: we }];

  const used = {}, out = {};

    for (let w = week; w < week + 30; w++) {
      const base = sc.wkStart(w);
      for (const D of DAYS) {
        const day = new Date(base); day.setDate(day.getDate() + D.off);
        if (day < fromDate) continue;
        const k = key(day), u = used[k] || 0;
        const long = it.min > 75;

        if (u > 0 && u + it.min > D.cap) continue;
        used[k] = u + it.min;
        const st = new Date(day); st.setMinutes(D.t + u);
        return st;
      }
    }
    return null;
  }
  for (const it of ITEMS) {
    if (isDone(it)) continue;
    const w = sc.map[it.id];
    const from = sc.wkStart(w) < today ? today : sc.wkStart(w);

function projSteps(p) { return projSessAll(p).some(x => S.done[x.id]) ? p.steps.map(() => true) : (S.proj[p.id] || []); }
function projDone(p) { const st = projSteps(p); return p.steps.every((_, i) => st[i]); }
function setProj(p, steps) {

out.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "cfgHours") { S.settings.hours = Number(t.value); save(); render(); }
  else if (t.id === "cfgStart" && t.value) { trPut("start", t.value); save(); render(); }
  else if (t.id === "cfgExam") { trPut("exam", t.value); save(); render(); }
  else if (t.id === "cfgWd" && t.value) { S.settings.wdTime = t.value; save(); render(); }
  else if (t.id === "cfgWe" && t.value) { S.settings.weTime = t.value; save(); render(); }
  else if (t.id === "apiModel") { setModel(t.value); keyS.msg = "Model set to " + t.value + "."; keyS.ok = true; render(); }
  else if (t.id === "imFile" && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(String(r.result));
        if (!o || typeof o !== "object" || !o.settings || !o.done) throw new Error("bad");
        S = mergeInto(normalize(o), S); S.migrated = true; save(); xfer.msg = "Imported and merged with what was here."; xfer.ok = true;
      } catch (e) { xfer.msg = "That file is not a progress export from this app."; xfer.ok = false; }
      render();
    };
    r.readAsText(t.files[0]);
  }
});
function setTrack(k) {
  k = k === "P" ? "P" : "F";
  if (S.settings.track === k && TRK === k) return;
  S.settings.track = k; useTrack(k);
  setQuizDomain(""); rf.d = ""; open.session = null;
  ackMsg = "Switched to " + TR.code + " " + TR.name; save();
}
function setQuizDomain(d) { quizS.d = d || ""; quizS.order = []; quizS.i = 0; quizS.pick = null; quizS.shown = false; quizS.gen = null; quizS.genErr = ""; }

document.getElementById("cmds").addEventListener("click", e => { const a = e.target.closest("[data-view]"); if (!a) return; e.preventDefault(); go(a.dataset.view); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== view && VIEWS[h]) go(h, false); });

/* prompt */
const pin = document.getElementById("promptIn");
const sug = document.getElementById("suggest");
let sugIdx = 0;
function showSuggest() {
  const v = pin.value;
  if (!v.startsWith("/") || v.includes(" ")) { sug.hidden = true; return; }
  const m = CMDS.filter(c => c[0].startsWith(v.toLowerCase()));
  if (!m.length) { sug.hidden = true; return; }
  sugIdx = Math.min(sugIdx, m.length - 1);
  sug.innerHTML = m.map((c, i) => '<button type="button" data-cmd="' + esc(c[0].split(" ")[0]) + '" class="' + (i === sugIdx ? "on" : "") + '"><span class="c">' + esc(c[0]) + "</span><span>" + esc(c[1]) + "</span></button>").join("");
  sug.hidden = false;
}
pin.addEventListener("input", () => { sugIdx = 0; showSuggest(); });
pin.addEventListener("keydown", e => {
  if (sug.hidden) return;
  const items = sug.querySelectorAll("button");
  if (e.key === "ArrowDown") { e.preventDefault(); sugIdx = (sugIdx + 1) % items.length; showSuggest(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sugIdx = (sugIdx - 1 + items.length) % items.length; showSuggest(); }
  else if (e.key === "Tab") { e.preventDefault(); const b = items[sugIdx]; if (b) { pin.value = b.dataset.cmd + " "; sug.hidden = true; } }
  else if (e.key === "Escape") { sug.hidden = true; }
});
sug.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pin.value = b.dataset.cmd; sug.hidden = true; document.getElementById("promptForm").requestSubmit(); });
document.getElementById("promptForm").addEventListener("submit", e => {
  e.preventDefault();
  let v = pin.value.trim();
  if (!sug.hidden && v.startsWith("/") && !v.includes(" ")) { const b = sug.querySelectorAll("button")[sugIdx]; if (b && b.dataset.cmd !== v) v = b.dataset.cmd; }
  sug.hidden = true;
  if (!v) return;
  pin.value = "";
  runInput(v);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== pin && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); pin.focus(); pin.value = "/"; showSuggest(); }
});

function runInput(v) {
  if (v.startsWith("/")) {
    const [c, ...rest] = v.slice(1).split(/\s+/);
    const arg = rest.join(" ");
    const cmd = c.toLowerCase();
    if (cmd === "resources") { rf.q = arg; rf.ty = "all"; rf.d = ""; return go("resources"); }
    if (cmd === "track") { setTrack(/^p/i.test(arg) ? "P" : /^f/i.test(arg) ? "F" : (TRK === "P" ? "F" : "P")); return go("today"); }
    if (cmd === "quiz") { const d = DOMAINS.some(x => x.id === arg.toUpperCase()) ? arg.toUpperCase() : ""; setQuizDomain(d); return go("quiz"); }
    if (cmd === "theme") { if (/^(dark|light|system)$/i.test(arg)) applyTheme(arg.toLowerCase()); else cycleTheme(); return; }
    if (cmd === "version") return go("changelog");
    if (cmd === "clear") { if (!chatBusy) chat.length = 0; return go("ask"); }
    if (VIEWS[cmd]) return go(cmd);
    return ask(v);
  }
  ask(v);
}

/* ---------------- Claude access: claude.ai, or your own API key ---------------- */
const KEY_STORE = "ccarf-apikey", MODEL_STORE = "ccarf-model";
const MODELS = [["claude-sonnet-5-5", "Sonnet 5.5 (recommended)"], ["claude-haiku-5-5", "Haiku 5.5 (cheapest, fastest)"], ["claude-opus-5-5", "Opus 5.5 (strongest, priciest)"]];
function getKey() { try { return localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function keyRemembered() { try { return !!localStorage.getItem(KEY_STORE); } catch (e) { return false; } }
function setKey(k, remember) { try { localStorage.removeItem(KEY_STORE); sessionStorage.removeItem(KEY_STORE); if (k) (remember ? localStorage : sessionStorage).setItem(KEY_STORE, k); } catch (e) {} }
function getModel() { try { return localStorage.getItem(MODEL_STORE) || MODELS[0][0]; } catch (e) { return MODELS[0][0]; } }
function setModel(m) { try { localStorage.setItem(MODEL_STORE, m); } catch (e) {} }
let hasSample = null, sampleFn = null;
async function getSample() {
  if (sampleFn) return sampleFn;
  if (!window.claude || typeof window.claude.use !== "function") { hasSample = false; return null; }
  try { sampleFn = await window.claude.use("sample"); } catch (e) { sampleFn = null; }
  hasSample = !!sampleFn;
  return sampleFn;
}
function llmMaybe() { return hasSample !== false || !!getKey(); }
function llmSource() { return hasSample ? "your claude.ai account" : getKey() ? "your API key (" + getModel() + ")" : "nothing yet"; }
function parseLoose(text) {
  const t = String(text || "").trim();
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = Math.min(...["{", "["].map(c => { const k = t.indexOf(c); return k < 0 ? Infinity : k; }));
  const b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a < Infinity && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: "invalid_json", text: t };
}
/* one entry point: claude.ai sample when present, else a direct call with the viewer's own key */
async function llm(input, opts) {
  const o = opts || {};
  const sample = await getSample();
  if (sample) {
    if (o.json) return await sample.json(input, { cache: false, signal: o.signal, modelTier: o.tier });
    const r = await sample(input, { cache: false, signal: o.signal, onText: o.onText, modelTier: o.tier });
    return r.text;
  }
  const key = getKey();
  if (!key) throw { code: "no_access" };
  const turns = typeof input === "string" ? [{ role: "user", content: input }] : input;
  const msgs = [];
  for (const t of turns) { const last = msgs[msgs.length - 1]; if (last && last.role === t.role) last.content += "\n\n" + t.content; else msgs.push({ role: t.role, content: t.content }); }
  let resp;
  try {
    resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: o.signal,
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: getModel(), max_tokens: o.maxTokens || 2000, messages: msgs })
    });
  } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
  if (!resp.ok) {
    let m = ""; try { const j = await resp.json(); m = (j.error && j.error.message) || ""; } catch (e) {}
    throw { code: resp.status === 401 || resp.status === 403 ? "bad_key" : resp.status === 429 ? "rate_limited" : resp.status === 404 ? "bad_model" : resp.status >= 500 ? "upstream_error" : "api_error", message: m };
  }
  const j = await resp.json();
  const text = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");
  if (!text.trim()) throw { code: "empty_completion" };
  if (o.onText) o.onText({ text, delta: text });
  return o.json ? parseLoose(text) : text;
}
function coachRules() {
  return "You are a concise study coach inside a learning app for the " + TR.full + " exam (" + TR.code + ") from Anthropic. " +
    "The exam has about " + TR.items + " scenario-based items in 120 minutes and " + DOMAINS.length + " domains: " + DOMAINS.map(d => d.id + " " + d.name + " (" + d.w + "%)").join("; ") + ". " +
    "Scenarios: " + SCENARIOS.join("; ") + ". Known exam traps: " + DOMAINS.map(d => d.traps.join(" ")).join(" ") +
    " Answer the learner's question accurately and practically, in plain text with short paragraphs or simple '-' bullets, no markdown headings, under 220 words unless asked for more. " +
    "Never use em dashes or en dashes; use commas, colons or parentheses instead. If you are unsure whether a product detail is current, say so and point to the official docs. " +
    "Learner progress: " + pctDone() + "% of sessions done, readiness " + readiness() + "/100.";
}
function errCopy(code, msg) {
  return ({ no_access: "Claude features need either this page opened in claude.ai or your own API key in /config.", bad_key: "The API key was rejected. Check it in /config.", bad_model: "That model is not available to your key. Pick another in /config.", network: "Could not reach the Claude API. Check your connection.", api_error: "The Claude API refused the request" + (msg ? ": " + String(msg).slice(0, 140) : "."), empty_completion: "Claude returned an empty answer. Try again.", not_granted: "Claude access was not allowed for this page.", sampling_disabled: "Claude is not available for this account.", rate_limited: "Too many requests right now. Try again in a minute.", session_expired: "Sign in to claude.ai again, then retry.", refused: "Claude declined that request. Try rephrasing it.", prompt_too_large: "That was too long. Ask a shorter question.", invalid_json: "The generated question could not be read. Try again." })[code] || "Something went wrong reaching Claude. Try again.";
}
async function ask(text) {
  if (chatBusy) return;
  chat.push({ role: "user", content: text });
  const msg = { role: "assistant", content: "", pending: true };
  chat.push(msg);
  view = "ask"; try { history.replaceState(null, "", "#ask"); } catch (e) {}
  chatBusy = true; render(); startSpin();
  chatCtl = new AbortController();
  const turns = [{ role: "user", content: coachRules() }];
  for (const m of chat.slice(-13, -1)) if (m.content && !m.err) turns.push({ role: m.role, content: m.content });
  if (turns[turns.length-1].role !== "user") turns.push({ role: "user", content: text });
  try {
    const ans = await llm(turns, { signal: chatCtl.signal, maxTokens: 1500, onText: ({ text: tt }) => { msg.content = tt; msg.pending = true; render(); } });
    msg.content = ans.replace(/\u2014|\u2013/g, ", ");
  } catch (e) {
    msg.content = (e && e.text) || msg.content;
    if (e && e.code !== "cancelled") msg.err = errCopy(e.code, e.message);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) hasSample = false;
  }
  msg.pending = false; chatBusy = false; chatCtl = null; render();
}
async function genQuestion() {
  if (quizS.genBusy) return;
  if (!(await getSample()) && !getKey()) { quizS.genErr = errCopy("no_access"); render(); return; }
  const D = quizS.d ? DOMAINS.find(x => x.id === quizS.d) : DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
  quizS.genBusy = true; quizS.genErr = ""; render(); startSpin();
  try {
    const seed = Math.random().toString(36).slice(2, 7);
    const obj = await llm(
      "Write one original, scenario-based multiple-choice question for the " + TR.full + " exam, domain " + D.id + " " + D.name + ". " +
      "Task statements: " + D.tasks.join("; ") + ". Ground it in one of these scenarios: " + SCENARIOS.join("; ") + ". " +
      "Four options, exactly one correct, plausible distractors, the correct option at a random position. Do not reuse common textbook examples (variation seed " + seed + "). Never use em dashes or en dashes. " +
      'Reply with only JSON: {"q": string, "o": [string, string, string, string], "a": number (0-3), "x": string (2 sentences explaining why)}',
      { json: true, maxTokens: 1200 });
    if (!obj || typeof obj.q !== "string" || !Array.isArray(obj.o) || obj.o.length !== 4 || !(obj.a >= 0 && obj.a <= 3)) throw { code: "invalid_json" };
    quizS.gen = { d: D.id, q: obj.q, o: obj.o.map(String), a: Number(obj.a), x: String(obj.x || "") };
    quizS.pick = null; quizS.shown = false;
  } catch (e) {
    if (e && e.code !== "cancelled") quizS.genErr = errCopy(e.code, e.message);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) hasSample = false;
  }
  quizS.genBusy = false; render();
}

/* spinner glyphs, like the CLI */
const GLYPHS = ["·", "✢", "✳", "✶", "✻", "✽"];
let spinTimer = null, gi = 0;
function startSpin() {
  if (spinTimer || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  spinTimer = setInterval(() => {
    const els = document.querySelectorAll("[data-spin]");
    if (!els.length && !chatBusy && !quizS.genBusy) { clearInterval(spinTimer); spinTimer = null; return; }
    gi = (gi + 1) % GLYPHS.length; els.forEach(el => el.textContent = GLYPHS[gi]);
  }, 140);
}

window.addEventListener("error", ev => { try { document.getElementById("stLeft").textContent = "error: " + (ev.message || "unknown") + (ev.lineno ? " @" + ev.lineno : ""); } catch (e) {} });
/* ---------------- theme: system / dark / light (Claude Code palettes) ---------------- */
const THEME_KEY = "ccarf-theme";
const hostTheme = document.documentElement.getAttribute("data-theme");
function getTheme() { try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return "system"; } }
function applyTheme(t) {
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const el = document.documentElement;
  if (t === "dark" || t === "light") el.setAttribute("data-theme", t);
  else if (hostTheme) el.setAttribute("data-theme", hostTheme); else el.removeAttribute("data-theme");
  const b = document.getElementById("themeBtn");
  if (b) b.textContent = (t === "light" ? "○ light" : t === "dark" ? "● dark" : "◐ system");
}
function cycleTheme() { const order = ["system", "dark", "light"]; applyTheme(order[(order.indexOf(getTheme()) + 1) % 3]); if (view === "config") render(); }

/* ---------------- boot ---------------- */
applyTheme(getTheme());
try { const vl = document.getElementById("verLink"); vl.textContent = "v" + APP_VERSION; vl.addEventListener("click", e => { e.preventDefault(); go("changelog"); }); } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", cycleTheme);
loadLocal();
const h0 = location.hash.slice(1);
view = VIEWS[h0] ? h0 : "today";
render();
initStore();
getSample();
})();
</script>
